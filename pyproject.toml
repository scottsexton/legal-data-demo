[project]
name = "legal-demo"
version = "0.1.0"
description = "Search and ask an LLM questions about Indiana Supreme Court opinions, using Databricks."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "databricks-sdk>=0.40",
    "databricks-connect>=16.1,<17",
    "databricks-vectorsearch>=0.40",
    "pandas>=2.2",
    "streamlit>=1.40",
    "pytest>=8.3",
    "ruff>=0.8",
    "openai>=1.60",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legal_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The prompt and test fixtures are long string literals.
"src/legal_demo/extract.py" = ["E501"]
"tests/*" = ["E501"]
# Databricks notebooks: spark/dbutils/display are injected globals, and imports follow sys.path setup.
"notebooks/*" = ["F821", "E402", "E501"]

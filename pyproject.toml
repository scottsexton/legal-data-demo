[project]
name = "legal-demo"
version = "0.1.0"
description = "Search and ask an LLM questions about Indiana Supreme Court opinions, using Databricks."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "databricks-sdk>=0.40",
    "databricks-connect>=16.1,<17",
    "databricks-vectorsearch>=0.40",
    "pandas>=2.2",
    "streamlit>=1.40",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legal_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

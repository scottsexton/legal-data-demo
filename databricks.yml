# Databricks Asset Bundle: defines the jobs and app that get deployed to the workspace.
# Docs: https://docs.databricks.com/dev-tools/bundles/
bundle:
  name: legal-data-demo

variables:
  catalog:
    description: Unity Catalog catalog that holds all demo data
    default: legal_demo
  chat_model:
    description: Foundation Model API endpoint for extraction and Q&A
    default: databricks-qwen3-next-80b-a3b-instruct
  embedding_model:
    description: Foundation Model API endpoint for embeddings (1024 dims)
    default: databricks-gte-large-en
  warehouse_id:
    description: SQL warehouse used by the app and SQL tasks
    default: bcb6defe8c0fdebf  # Serverless Starter Warehouse

  vs_endpoint:
    description: Vector Search endpoint name
    default: legal-demo-vs

# Raw data is downloaded and uploaded from a laptop (scripts/download_cap.py), because Free
# Edition serverless compute can't reach static.case.law. This job does everything after that.
resources:
  jobs:
    legal_pipeline:
      name: legal-data-pipeline
      description: Volume JSON → silver documents/chunks → LLM people/events (gold) → Vector Search
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: chat_model
          default: ${var.chat_model}
        - name: embedding_model
          default: ${var.embedding_model}
        - name: vs_endpoint
          default: ${var.vs_endpoint}
        - name: max_docs
          default: "0"
        - name: workers
          default: "6"
        - name: code_path
          default: /Volumes/${var.catalog}/raw/code/${bundle.target}
      tasks:
        - task_key: transform
          notebook_task:
            notebook_path: notebooks/02_transform.py
        - task_key: extract
          depends_on: [{ task_key: transform }]
          timeout_seconds: 10800
          notebook_task:
            notebook_path: notebooks/03_extract.py
        - task_key: index
          depends_on: [{ task_key: transform }]
          timeout_seconds: 5400
          notebook_task:
            notebook_path: notebooks/04_index.py
        - task_key: validate
          depends_on: [{ task_key: extract }, { task_key: index }]
          notebook_task:
            notebook_path: notebooks/05_validate.py

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-eade77b4-fdf2.cloud.databricks.com
    # The app is dev-only for now: deploying it from CI would need the CI service principal to
    # be able to grant the app access to the warehouse, model endpoints and tables.
    resources:
      apps:
        legal_app:
          name: legal-demo
          description: Browse, search and ask questions about Indiana Supreme Court opinions
          source_code_path: ./app
          # Grants for the app's own service principal. Workspace sign-in controls who can open it.
          resources:
            - name: sql-warehouse
              sql_warehouse: { id: "${var.warehouse_id}", permission: CAN_USE }
            - name: chat-model
              serving_endpoint: { name: "${var.chat_model}", permission: CAN_QUERY }
            - name: embedding-model
              serving_endpoint: { name: "${var.embedding_model}", permission: CAN_QUERY }
            - name: documents
              uc_securable:
                { securable_full_name: "${var.catalog}.silver.documents", securable_type: TABLE, permission: SELECT }
            - name: chunks-index
              uc_securable:
                { securable_full_name: "${var.catalog}.silver.chunks_index", securable_type: TABLE, permission: SELECT }
            - name: entities
              uc_securable:
                { securable_full_name: "${var.catalog}.gold.entities", securable_type: TABLE, permission: SELECT }
            - name: events
              uc_securable:
                { securable_full_name: "${var.catalog}.gold.events", securable_type: TABLE, permission: SELECT }
  prod:
    # Deployed by GitHub Actions as the `legal-data-demo-ci` service principal, into that
    # principal's own workspace folder. Workspace admins can view and manage it.
    mode: production
    workspace:
      host: https://dbc-eade77b4-fdf2.cloud.databricks.com
      root_path: /Workspace/Users/da061def-bd47-4813-82c4-f55e52721e0c/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: da061def-bd47-4813-82c4-f55e52721e0c
    permissions:
      - service_principal_name: da061def-bd47-4813-82c4-f55e52721e0c
        level: CAN_MANAGE
      - group_name: admins
        level: CAN_MANAGE
